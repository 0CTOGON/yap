[package]
name = "yap-core"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }

yap-protocol = { path = "../yap-protocol" }
